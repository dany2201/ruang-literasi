backend:
  name: git-gateway
  branch: main

locale: id
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "artikel"
    label: "Artikel"
    label_singular: "Artikel"
    folder: "content/posts"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Judul Artikel", name: "title", widget: "string" }
      - { label: "Tanggal Terbit", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { label: "Kategori", name: "category", widget: "select", options: ["Strategi Belajar", "Literasi Digital", "Literasi Membaca", "Berpikir Kritis", "Teknologi Pendidikan", "Pendidikan Umum"] }
      - { label: "Gambar Sampul", name: "image", widget: "image", required: false, default: "/assets/cerita-1.svg" }
      - { label: "Ringkasan Singkat", name: "excerpt", widget: "text" }
      - { label: "Isi Artikel (pisahkan paragraf dengan baris kosong)", name: "body", widget: "text" }
      - { label: "Terbitkan artikel?", name: "published", widget: "boolean", default: true }
